name: officeapp-php81-test

services:
  app:
    build:
      context: .
      dockerfile: docker/php81/Dockerfile
    command:
      - /bin/sh
      - -c
      - >-
        php bin/migrate.php
        && php bin/sync-reference-data.php
        && php tests/authenticated-session-termination.php
        && php tests/run.php
        && php tests/attendance-geofence-authorization.php
        && php tests/migration-checksum-compatibility.php
        && php tests/permission-template-upgrade.php
        && php tests/company-update-permission-preservation.php
        && php tests/inventory-valuation-migration.php
        && php tests/accounting-period-integration.php
        && php tests/sales-integration.php
        && php tests/procurement-integration.php
        && php tests/action-required-counts.php
        && php tests/settlement-integration.php
        && php tests/sales-workflow-trace.php
        && php tests/module-authorization-contract.php
        && php tests/analytics-integration.php
        && php tests/approval-operations-integration.php
    environment:
      APP_NAME: OfficeApp ERP PHP 8.1 Compatibility
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_TIMEZONE: Africa/Nairobi
      APP_BASE_PATH: /office_app/public
      APP_COMPANY_CODE: default
      SESSION_NAME: office_app_php81_test
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: Strict
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: office_app_php81_test
      DB_USERNAME: officeapp_php81
      DB_PASSWORD: officeapp-php81-password
      TEST_ADMIN_USERNAME: test_platform_admin
      TEST_ADMIN_PASSWORD: OfficeApp-Test!2026
      POWER_BI_ENCRYPTION_KEY: officeapp-testing-power-bi-key-2026-secure
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11.18
    environment:
      MARIADB_DATABASE: office_app_php81_test
      MARIADB_USER: officeapp_php81
      MARIADB_PASSWORD: officeapp-php81-password
      MARIADB_ROOT_PASSWORD: officeapp-php81-root-password
      OFFICEAPP_LOAD_TEST_FIXTURES: "1"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/migrations:/opt/officeapp/database/migrations:ro
      - ./database/seeds:/opt/officeapp/database/seeds:ro
      - ./tests/fixtures:/opt/officeapp/tests/fixtures:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

