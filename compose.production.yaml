name: officeapp-production

services:
  app:
    build:
      context: .
      target: production
    environment:
      APP_NAME: ${APP_NAME:-OfficeApp ERP}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Nairobi}
      APP_COMPANY_CODE: ${APP_COMPANY_CODE:-default}
      SESSION_NAME: ${SESSION_NAME:-office_app_session}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:erp-admin@example.com}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_ALLOWED_HOSTS: ${WEB_PUSH_ALLOWED_HOSTS:-fcm.googleapis.com,updates.push.services.mozilla.com,push.services.mozilla.com,web.push.apple.com,*.notify.windows.com}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          exit(@file_get_contents(
          'http://127.0.0.1:8080/office_app/public/health'
          ) === false ? 1 : 0);
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  integration-worker:
    extends:
      service: app
    ports: []
    command: ["/bin/sh","-c","while true; do php bin/run-production-task.php integration; sleep 15; done"]
    healthcheck:
      disable: true

  webhook-worker:
    extends:
      service: app
    ports: []
    command: ["/bin/sh","-c","while true; do php bin/run-production-task.php webhooks; sleep 30; done"]
    healthcheck:
      disable: true

  attendance-scheduler:
    extends:
      service: app
    ports: []
    command: ["/bin/sh","-c","while true; do php bin/run-production-task.php attendance; sleep 60; done"]
    healthcheck:
      disable: true

  db:
    image: mariadb:10.11.18
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - officeapp_production_db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  officeapp_production_db_data:
