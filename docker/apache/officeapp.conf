ServerName localhost

SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

RewriteEngine On
RewriteRule ^/office_app/public/assets(?:/[0-9]+(?:/(?:activate|transfer|maintenance|dispose|depreciation/[0-9]+/post))?|/categories|/capitalize)?/?$ /office_app/public/index.php [QSA,PT,L]

Alias /office_app /var/www/html/office_app

<Directory "/var/www/html/office_app">
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/office_app/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    FallbackResource /office_app/public/index.php
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self)"
Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://app.powerbi.com"
